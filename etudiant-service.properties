etudiant.params.x=44
etudiant.params.y=11



spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/etudiant_service?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.show-sql= true
spring.jpa.hibernate.ddl-auto = update



# Multipart (déjà configuré)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ========== NOUVELLE CONFIGURATION NEXTCLOUD ==========
# Type de stockage : local ou nextcloud
file.storage.type=nextcloud

# Configuration Nextcloud
nextcloud.url=http://localhost:8080
nextcloud.username=admin
nextcloud.password=admin123
nextcloud.base-path=/remote.php/dav/files/admin
nextcloud.documents-folder=enrollments

# ========== ANCIENNE CONFIG (gardée en commentaire pour backup) ==========
# file.upload-dir=./uploads/documents
# spring.web.resources.static-locations=file:./uploads/documents/
# spring.mvc.static-path-pattern=/documents/**

spring.cloud.discovery.enabled=true

